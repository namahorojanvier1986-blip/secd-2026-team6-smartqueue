<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umwalimu SACCO - Smart Queue</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:20px}
.card{max-width:480px;margin:auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);border-top:8px solid #FFC72C}
h1{color:#0057A8;margin:0;font-size:28px}
.sub{color:#666;margin:6px 0 18px}
label{font-weight:bold;color:#333;display:block;margin:14px 0 6px}
select{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px}
.btn{width:100%;padding:14px;background:#0057A8;color:#fff;border:none;border-radius:8px;font-size:18px;font-weight:bold;margin-top:20px;cursor:pointer}
.btn:hover{background:#003f7a}
.teller{display:block;text-align:center;margin-top:16px;color:#0057A8}
.ticket{margin-top:20px;padding:16px;background:#FFF8DC;border:2px solid #FFC72C;border-radius:8px;text-align:center;display:none}
.ticket b{font-size:32px;color:#0057A8}
.priority{color:#B77900;font-weight:bold}
</style></head>
<body>
<div class="card">
<h1>Umwalimu SACCO Bank</h1>
<p class="sub">Smart Queue Management System - SQMS<br>Karibu, Mwalimu! Welcome, Teacher!</p>
<p>Choose branch and service to get your ticket.</p>
<label>Branch - Ishami</label>
<select><option>Umwalimu SACCO - Musanze Branch</option><option>Umwalimu SACCO - Kigali Branch</option><option>Umwalimu SACCO - Huye Branch</option></select>
<label>Service - Serivisi</label>
<select><option>Deposit - Kubitsa amafaranga</option><option>Withdrawal - Gukura amafaranga</option><option>Loan - Inguzanyo</option></select>
<label>Priority - Umwihariko</label>
<select id="pri"><option>Normal - Nta mwihariko</option><option>Elderly / Abageze mu zabukuru</option><option>Disabled / Abafite ubumuga</option><option>Pregnant / Abatwite</option></select>
<button class="btn" onclick="document.getElementById('t').style.display='block'">Get Ticket - Fata Ticket</button>
<a class="teller" href="#">I am a Teller - Ndi Umukozi →</a>
<div id="t" class="ticket"><div class="priority">⭐ PRIORITY TICKET</div><b>A-012</b><br>Branch: Musanze | Service: Deposit<br>People ahead: 3 | Wait: ~15 min</div>
</div></body></html>
