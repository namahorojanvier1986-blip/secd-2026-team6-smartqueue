<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ER Diagram - SQMS</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f8;padding:16px}
.card{max-width:1000px;margin:auto;background:#fff;padding:24px;border-radius:14px}
h1{text-align:center;color:#0057A8}
svg{width:100%;height:auto;border:2px solid #0057A8;border-radius:12px}
</style>
</head>
<body>
<div class="card">
<h1>ER DIAGRAM — SQMS SmartQueue</h1>
<p style="text-align:center;color:#666">Umwalimu SACCO | Team 6 | Simple ariko yujuje byose</p>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
<rect x="20" y="20" width="220" height="150" rx="10" fill="#EAF2FF" stroke="#0057A8" stroke-width="2"/>
<text x="130" y="45" text-anchor="middle" font-weight="bold" fill="#0057A8">USERS</text>
<text x="35" y="70">PK user_id</text><text x="35" y="90">staff_id (UNIQUE)</text><text x="35" y="110">full_name, phone</text><text x="35" y="130">pin_hash, role</text><text x="35" y="150">Teller / Manager / IT</text>
<rect x="390" y="20" width="220" height="150" rx="10" fill="#E8F8EF" stroke="#0B6B3A" stroke-width="2"/>
<text x="500" y="45" text-anchor="middle" font-weight="bold" fill="#0B6B3A">SERVICES</text>
<text x="405" y="70">PK service_id</text><text x="405" y="90">service_code</text><text x="405" y="110">Kubitsa, Kubikura</text><text x="405" y="130">Gufungura Konti</text><text x="405" y="150">Gusaba Inguzanyo</text>
<rect x="760" y="20" width="220" height="150" rx="10" fill="#F0E9FF" stroke="#5B2EA6" stroke-width="2"/>
<text x="870" y="45" text-anchor="middle" font-weight="bold" fill="#5B2EA6">CUSTOMERS</text>
<text x="775" y="70">PK customer_id</text><text x="775" y="90">full_name</text><text x="775" y="110">phone_number</text><text x="775" y="130">language: rw/en/fr</text>
<rect x="390" y="230" width="220" height="180" rx="10" fill="#FFF3CD" stroke="#8A6500" stroke-width="3"/>
<text x="500" y="255" text-anchor="middle" font-weight="bold" fill="#8A6500">TICKETS</text>
<text x="405" y="280">PK ticket_id</text><text x="405" y="300">ticket_no: A-046, P-012</text><text x="405" y="320">FK customer_id</text><text x="405" y="340">FK service_id</text><text x="405" y="360">FK served_by (USERS)</text><text x="405" y="380">status, priority</text><text x="405" y="400">queue_position</text>
<rect x="20" y="230" width="220" height="150" rx="10" fill="#fff" stroke="#0057A8" stroke-width="2"/>
<text x="130" y="255" text-anchor="middle" font-weight="bold">QUEUE</text>
<text x="35" y="280">PK queue_id</text><text x="35" y="300">FK ticket_id UNIQUE</text><text x="35" y="320">position</text><text x="35" y="340">priority 1:2 Normal</text><text x="35" y="360">is_current</text>
<rect x="760" y="230" width="220" height="150" rx="10" fill="#fff" stroke="#dc3545" stroke-width="2"/>
<text x="870" y="255" text-anchor="middle" font-weight="bold" fill="#dc3545">OTP_CODES</text>
<text x="775" y="280">PK otp_id</text><text x="775" y="300">FK user_id</text><text x="775" y="320">otp_code 6-digit</text><text x="775" y="340">expires_at +5 min</text><text x="775" y="360">is_used</text>
<rect x="20" y="440" width="220" height="130" rx="10" fill="#fff" stroke="#198754" stroke-width="2"/>
<text x="130" y="465" text-anchor="middle" font-weight="bold" fill="#198754">REPORTS</text>
<text x="35" y="490">PK report_id</text><text x="35" y="510">report_date, served</text><text x="35" y="530">avg_wait, bottleneck</text><text x="35" y="550">FK generated_by</text>
<rect x="760" y="440" width="220" height="130" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="870" y="465" text-anchor="middle" font-weight="bold">AUDIT_LOGS</text>
<text x="775" y="490">PK log_id</text><text x="775" y="510">FK user_id</text><text x="775" y="530">action, details</text><text x="775" y="550">created_at</text>
<line x1="240" y1="90" x2="390" y2="90" stroke="#0057A8" stroke-width="2"/><text x="300" y="80" font-size="12">1 - N</text>
<line x1="610" y1="90" x2="760" y2="90" stroke="#5B2EA6" stroke-width="2"/><text x="670" y="80" font-size="12">1 - N</text>
<line x1="500" y1="170" x2="500" y2="230" stroke="#8A6500" stroke-width="2"/><text x="510" y="200" font-size="12">1 - N</text>
<line x1="390" y1="320" x2="240" y2="320" stroke="#0057A8" stroke-width="2"/><text x="300" y="310" font-size="12">1 - 1</text>
<line x1="610" y1="320" x2="760" y2="320" stroke="#dc3545" stroke-width="2"/><text x="670" y="310" font-size="12">1 - N</text>
<line x1="130" y1="380" x2="130" y2="440" stroke="#198754" stroke-width="2"/><text x="140" y="410" font-size="12">1 - N</text>
<line x1="870" y1="380" x2="870" y2="440" stroke="#333" stroke-width="2"/><text x="880" y="410" font-size="12">1 - N</text>
<text x="500" y="600" text-anchor="middle" font-size="13" fill="#666">PK = Primary Key | FK = Foreign Key | 1 - N = One to Many</text>
</svg>
</div>
</body>
</html>
